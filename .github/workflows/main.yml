name: Build GIG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      free_debug:
        description: "Enable the debug build (manual launch only)"
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Copy test script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Release/test
          Copy-Item test/test.gig build/Release/test/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gig-windows
          path: |
            build/Release/gig.exe
            build/Release/test/

  build-android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ARMv7 (32-bit) and ARMv8 (64-bit)
        abi:
          - armeabi-v7a
          - arm64-v8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;27.2.12479018" \
                     "cmake;3.22.1"

      - name: Download SDL3
        run: |
          git clone --depth 1 --branch release-3.2.x \
            https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Prepare SDL Android activity files
        run: |
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R third_party/SDL/android-project/app/src/main/java/org/libsdl/app \
            android/app/src/main/java/org/libsdl/

      - name: Build APK
        working-directory: android
        env:
          SDL3_DIR: ${{ github.workspace }}/third_party/SDL
          FREE_DEBUG: ${{ inputs.free_debug || 'false' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -Pabis=${{ matrix.abi }} \
            -PfreeDebug=$FREE_DEBUG

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gig-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build-android-universal:
    name: Android (universal ARMv7 + ARMv8)
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;27.2.12479018" \
                     "cmake;3.22.1"

      - name: Download SDL3
        run: |
          git clone --depth 1 --branch release-3.2.x \
            https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Prepare SDL Android activity files
        run: |
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R third_party/SDL/android-project/app/src/main/java/org/libsdl/app \
            android/app/src/main/java/org/libsdl/

      - name: Build universal APK
        working-directory: android
        env:
          SDL3_DIR: ${{ github.workspace }}/third_party/SDL
          FREE_DEBUG: ${{ inputs.free_debug || 'false' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -Pabis=armeabi-v7a,arm64-v8a \
            -PfreeDebug=$FREE_DEBUG

      - name: Upload universal Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gig-android-universal-armv7-armv8
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
