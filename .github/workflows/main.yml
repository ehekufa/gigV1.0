name: Build GIG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      free_debug:
        description: 'Enable the debug build (manual launch only)'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the project
        run: cmake --build build --config Release

      - name: Copy test script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Release/test
          Copy-Item test/test.gig build/Release/test/

      - uses: actions/upload-artifact@v4
        with:
          name: gig-windows
          path: |
            build/Release/gig.exe
            build/Release/test/

  build-android:
    # armeabi-v7a = ARMv7; arm64-v8a = ARMv8.
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch SDL3
        run: git clone --depth 1 --branch release-3.2 https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Prepare SDL Android activity sources
        run: |
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R third_party/SDL/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/

      - name: Build APK
        working-directory: android
        env:
          SDL3_DIR: ${{ github.workspace }}/third_party/SDL
          FREE_DEBUG: ${{ inputs.free_debug || 'false' }}
        run: ./gradlew --no-daemon assembleRelease -Pabis=${{ matrix.abi }} -PfreeDebug=$FREE_DEBUG

      - uses: actions/upload-artifact@v4
        with:
          name: gig-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release.apk

  build-android-universal:
    name: Android (universal ARMv7 + ARMv8)
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - run: git clone --depth 1 --branch release-3.2 https://github.com/libsdl-org/SDL.git third_party/SDL

      - name: Prepare SDL Android activity sources
        run: |
          mkdir -p android/app/src/main/java/org/libsdl
          cp -R third_party/SDL/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/

      - name: Build one APK for both ARM ABIs
        working-directory: android
        env:
          SDL3_DIR: ${{ github.workspace }}/third_party/SDL
          FREE_DEBUG: ${{ inputs.free_debug || 'false' }}
        run: ./gradlew --no-daemon assembleRelease -Pabis=armeabi-v7a,arm64-v8a -PfreeDebug=$FREE_DEBUG

      - uses: actions/upload-artifact@v4
        with:
          name: gig-android-universal-armv7-armv8
          path: android/app/build/outputs/apk/release/app-release.apk
